appId: com.blockmergearena.app
name: Skip Welcome
---
- launchApp:
    clearState: true

# Wait for either the welcome screen or home screen to appear (testID-based,
# since neither renders the literal text "Block Merge").
- extendedWaitUntil:
    visible:
      id: "welcome-screen"
    timeout: 30000
    optional: true

# If we landed on welcome, tap "Start playing" and wait for home.
- runFlow:
    when:
      visible:
        id: "welcome-screen"
    commands:
      - tapOn:
          id: "lets-play-button"
      - extendedWaitUntil:
          visible:
            id: "home-screen"
          timeout: 10000

# If welcome wasn't shown (state already had welcome-complete), just wait for home.
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 30000
- assertVisible:
    id: "home-screen"
