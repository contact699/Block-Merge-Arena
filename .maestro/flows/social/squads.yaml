appId: com.blockmergearena.app
name: Squads Screen
---
- launchApp

- extendedWaitUntil:
    visible:
      text: "Block Merge"
    timeout: 10000

- scroll
- tapOn:
    id: "squads-button"
- assertVisible:
    id: "squads-screen"

- tapOn:
    id: "discover-tab"
- tapOn:
    id: "squad-leaderboard-tab"
- tapOn:
    id: "invites-tab"
- tapOn:
    id: "my-squad-tab"

- tapOn:
    id: "back-button"
- assertVisible:
    id: "home-screen"
