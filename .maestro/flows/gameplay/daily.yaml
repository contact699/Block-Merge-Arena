appId: com.blockmergearena.app
name: Daily Mode
---
- launchApp

# Auto-skip welcome if it appears.
- runFlow:
    when:
      visible:
        id: "welcome-screen"
    commands:
      - tapOn:
          id: "lets-play-button"

- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 30000

- tapOn:
    id: "tournament-button"
- assertVisible:
    id: "tournament-screen"
- assertVisible:
    id: "back-button"

- assertVisible:
    id: "start-tournament-button"
- tapOn:
    id: "start-tournament-button"

# Run is in flight — verify the board is interactive.
- extendedWaitUntil:
    visible:
      id: "cell-0-0"
    timeout: 5000
- tapOn:
    id: "cell-0-0"
- tapOn:
    id: "cell-2-2"

- tapOn:
    id: "back-button"
- assertVisible:
    id: "home-screen"
