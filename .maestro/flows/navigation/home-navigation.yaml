    id: "shop-button"
- extendedWaitUntil:
    visible:
      id: "shop-screen"
    timeout: 10000
- tapOn:
    id: "back-button"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 10000

# 7. Achievements
- tapOn:
    id: "achievements-button"
- extendedWaitUntil:
    visible:
      id: "achievements-screen"
    timeout: 10000
- tapOn:
    id: "back-button"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 10000

# 8. Tutorials
- tapOn:
    id: "tutorials-button"
- extendedWaitUntil:
    visible:
      id: "tutorials-screen"
    timeout: 10000
- tapOn:
    id: "back-button"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 10000

# 9. Ranks (scroll needed)
- scroll
- tapOn:
    id: "ranks-button"
- extendedWaitUntil:
    visible:
      id: "ranks-screen"
    timeout: 10000
- tapOn:
    id: "back-button"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 10000

# 10. Battle Pass (scroll needed)
- scroll
- tapOn:
    id: "battlepass-button"
- extendedWaitUntil:
    visible:
      id: "battlepass-screen"
    timeout: 10000
- tapOn:
    id: "back-button"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 10000

# 11. Squads (scroll needed)
- scroll
- tapOn:
    id: "squads-button"
- extendedWaitUntil:
    visible:
      id: "squads-screen"
    timeout: 10000
- tapOn:
    id: "back-button"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 10000

# 12. Friends (scroll needed)
- scroll
- tapOn:
    id: "friends-button"
- extendedWaitUntil:
    visible:
      id: "friends-screen"
    timeout: 10000
- tapOn:
    id: "back-button"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 10000

# 13. Share (at very bottom)
- scrollUntilVisible:
    element:
      text: "Share and TikTok"
    direction: DOWN
    timeout: 30000
    speed: 80
- tapOn:
    text: "Share and TikTok"
- extendedWaitUntil:
    visible:
      id: "share-screen"
    timeout: 10000
- tapOn:
    id: "back-button"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 10000

# 14. Settings (tap below status bar to avoid notification shade)
- swipe:
    direction: DOWN
    duration: 400
- tapOn:
    id: "settings-button"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 10000
- tapOn:
    id: "back-button"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 10000
