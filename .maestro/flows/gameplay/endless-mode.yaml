appId: com.blockmergearena.app
name: Endless Mode Gameplay
---
- launchApp

# Auto-skip welcome if it appears.
- runFlow:
    when:
      visible:
        id: "welcome-screen"
    commands:
      - tapOn:
          id: "lets-play-button"

- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 30000

- tapOn:
    id: "endless-mode-button"
- assertVisible:
    id: "game-screen"

# Verify the board is interactive (cells render with `cell-{r}-{c}` testIDs).
- extendedWaitUntil:
    visible:
      id: "cell-0-0"
    timeout: 5000

- tapOn:
    id: "cell-0-0"
- tapOn:
    id: "cell-1-1"
- tapOn:
    id: "cell-2-2"
- tapOn:
    id: "cell-3-3"

# Game still running.
- assertVisible:
    id: "game-screen"

- back
- assertVisible:
    id: "home-screen"
