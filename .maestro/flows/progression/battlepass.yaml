appId: com.blockmergearena.app
name: Battle Pass Screen
---
- launchApp

- extendedWaitUntil:
    visible:
      text: "Block Merge"
    timeout: 10000

- scroll
- tapOn:
    id: "battlepass-button"
- assertVisible:
    id: "battlepass-screen"
- assertVisible:
    text: "← Back"

- tapOn:
    id: "back-button"
- assertVisible:
    id: "home-screen"
