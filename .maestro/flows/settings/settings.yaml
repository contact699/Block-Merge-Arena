appId: com.blockmergearena.app
name: Settings Screen
---
- launchApp

# Auto-skip welcome if it appears.
- runFlow:
    when:
      visible:
        id: "welcome-screen"
    commands:
      - tapOn:
          id: "lets-play-button"

- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 30000

- tapOn:
    id: "settings-button"
- assertVisible:
    id: "settings-screen"

# Verify the four-section grouping (AUDIO / DISPLAY / ACCOUNT / ABOUT)
# and the rows within them.
- assertVisible:
    text: "AUDIO"
- assertVisible:
    text: "Sound effects"
- assertVisible:
    text: "Haptics"

- assertVisible:
    id: "sound-toggle-row"
- assertVisible:
    id: "haptic-toggle-row"

# Toggle the Sound effects row to confirm interactivity.
- tapOn:
    id: "sound-toggle-row"

# Scroll down to reach DISPLAY / ACCOUNT / ABOUT groups.
- scroll
- assertVisible:
    text: "DISPLAY"
- assertVisible:
    id: "reduced-motion-toggle-row"

- scroll
- assertVisible:
    text: "ACCOUNT"
- assertVisible:
    text: "Display name"

- scroll
- assertVisible:
    text: "ABOUT"
- assertVisible:
    text: "Privacy"

- scroll up
- scroll up
- tapOn:
    id: "back-button"
- assertVisible:
    id: "home-screen"
