appId: com.blockmergearena.app
name: Friends Screen
---
- launchApp

- extendedWaitUntil:
    visible:
      text: "Block Merge"
    timeout: 10000

- scroll
- tapOn:
    id: "friends-button"
- assertVisible:
    id: "friends-screen"

- assertVisible:
    text: "Your Friend Code"

# Test tabs
- tapOn:
    text: "📬 Requests"
- tapOn:
    text: "⚔️ Challenges"
- tapOn:
    text: "📊 Activity"
- tapOn:
    text: "👥 Friends"

# Test add friend modal
- tapOn:
    id: "add-friend-button"
- assertVisible:
    text: "Add Friend"
- assertVisible:
    text: "Friend Code"
- tapOn:
    text: "✕"

- tapOn:
    id: "back-button"
- assertVisible:
    id: "home-screen"
