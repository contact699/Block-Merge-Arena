appId: com.blockmergearena.app
name: Home Screen Navigation
---
- launchApp

# Dismiss ANR dialog if it shows
- runFlow:
    when:
      visible:
        text: "Wait"
    commands:
      - tapOn:
          text: "Wait"

# Handle welcome screen if present
- extendedWaitUntil:
    visible:
      text: "Skip Tutorial"
    timeout: 60000
    optional: true

- runFlow:
    when:
      visible:
        text: "Skip Tutorial"
    commands:
      - tapOn:
          text: "Skip Tutorial"
      - extendedWaitUntil:
          visible:
            id: "home-screen"
          timeout: 30000

# Wait for home screen
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 30000
- assertVisible:
    id: "home-screen"

# 1. Endless Mode
- tapOn:
    id: "endless-mode-button"
- extendedWaitUntil:
    visible:
      id: "game-screen"
    timeout: 10000
- back
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 10000

# 3. Tournament
- tapOn:
    id: "tournament-button"
- extendedWaitUntil:
    visible:
      id: "tournament-screen"
    timeout: 10000
- tapOn:
    id: "back-button"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 10000

# 4. Leaderboard
- tapOn:
    id: "leaderboard-button"
- extendedWaitUntil:
    visible:
      id: "leaderboard-screen"
    timeout: 10000
- tapOn:
    id: "back-button"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 10000

# 5. Replays
