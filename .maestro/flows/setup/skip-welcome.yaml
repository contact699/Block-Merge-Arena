appId: com.blockmergearena.app
name: Skip Welcome
---
- launchApp:
    clearState: true

# Wait for either the welcome screen or home screen to appear
- extendedWaitUntil:
    visible:
      text: "Block Merge"
    timeout: 30000

# Tap "Start playing" if the welcome screen is visible
- runFlow:
    when:
      visible:
        id: "welcome-screen"
    commands:
      - tapOn:
          id: "lets-play-button"
      - extendedWaitUntil:
          visible:
            id: "home-screen"
          timeout: 10000
