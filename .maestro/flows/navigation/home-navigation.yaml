appId: com.blockmergearena.app
name: Home Screen Navigation
---
- launchApp

# Dismiss ANR dialog if it shows
- runFlow:
    when:
      visible:
        text: "Wait"
    commands:
      - tapOn:
          text: "Wait"

# Handle welcome screen if present
- runFlow:
    when:
      visible:
        id: "welcome-screen"
    commands:
      - tapOn:
          id: "lets-play-button"
      - extendedWaitUntil:
          visible:
            id: "home-screen"
          timeout: 30000

# Wait for home screen
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 30000
- assertVisible:
    id: "home-screen"

# 1. Endless Mode
- tapOn:
    id: "endless-mode-button"
- extendedWaitUntil:
    visible:
      id: "game-screen"
    timeout: 10000
- back
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 10000

# 3. Tournament
- tapOn:
    id: "tournament-button"
- extendedWaitUntil:
    visible:
      id: "tournament-screen"
    timeout: 10000
- tapOn:
    id: "back-button"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 10000

# 4. Leaderboard
- tapOn:
    id: "leaderboard-button"
- extendedWaitUntil:
    visible:
      id: "leaderboard-screen"
    timeout: 10000
- tapOn:
    id: "back-button"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 10000

# 5. Replays
- tapOn:
    id: "replays-button"
- extendedWaitUntil:
    visible:
      id: "replays-screen"
    timeout: 10000
- tapOn:
    id: "back-button"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 10000

# 6. Shop
- tapOn:
    id: "shop-button"
- extendedWaitUntil:
    visible:
      id: "shop-screen"
    timeout: 10000
- tapOn:
    id: "back-button"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 10000

# 7. Achievements
- tapOn:
    id: "achievements-button"
- extendedWaitUntil:
    visible:
      id: "achievements-screen"
    timeout: 10000
- tapOn:
    id: "back-button"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 10000

# Note: Share button and Settings button are skipped in this flow.
# - Share: nested gradient wrapper makes testID/text invisible to Maestro
# - Settings: positioned too close to status bar, triggers notification shade
# Both screens are tested individually in their own flow files.
# Cut from v1: tutorials, ranks, battlepass, squads, friends.
