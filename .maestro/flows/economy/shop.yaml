appId: com.blockmergearena.app
name: Shop Screen
---
- launchApp

# Auto-skip welcome if it appears.
- runFlow:
    when:
      visible:
        id: "welcome-screen"
    commands:
      - tapOn:
          id: "lets-play-button"

- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 30000

- tapOn:
    id: "shop-button"
- assertVisible:
    id: "shop-screen"
- assertVisible:
    text: "Themes"

- tapOn:
    id: "themes-tab"
- tapOn:
    id: "blocks-tab"
- tapOn:
    id: "gems-tab"
- tapOn:
    id: "themes-tab"

- tapOn:
    id: "back-button"
- assertVisible:
    id: "home-screen"
