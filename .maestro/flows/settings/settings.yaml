appId: com.blockmergearena.app
name: Settings Screen
---
- launchApp

- extendedWaitUntil:
    visible:
      text: "Block Merge"
    timeout: 10000

- tapOn:
    id: "settings-button"
- assertVisible:
    id: "settings-screen"

- assertVisible:
    text: "Profile"
- assertVisible:
    text: "Audio"
- assertVisible:
    text: "Display Name"

- tapOn:
    id: "display-name-input"
- eraseText:
    charactersToErase: 30
- inputText: "TestPlayer"

- scroll
- assertVisible:
    text: "Haptics"
- assertVisible:
    text: "Gameplay"

- scroll
- assertVisible:
    id: "save-button"
- assertVisible:
    id: "reset-button"
- assertVisible:
    text: "Block Merge Arena v1.0.0"

- scroll up
- tapOn:
    id: "back-button"
- assertVisible:
    id: "home-screen"
