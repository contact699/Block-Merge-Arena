appId: com.blockmergearena.app
name: Achievements Screen
---
- launchApp

# Auto-skip welcome if it appears.
- runFlow:
    when:
      visible:
        id: "welcome-screen"
    commands:
      - tapOn:
          id: "lets-play-button"

- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 30000

- tapOn:
    id: "achievements-button"
- assertVisible:
    id: "achievements-screen"
- assertVisible:
    id: "back-button"

- tapOn:
    id: "back-button"
- assertVisible:
    id: "home-screen"
